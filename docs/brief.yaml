# At-a-glance brief (rule R22). Edit here only; `python scripts/brief.py` writes it into README.md and the pages.
repo_url: https://github.com/sabrinapribadi/graph-fraud-detector
brief:
  - w: What
    lines:
      - "A Bitcoin fraud detector: graph and tabular models score transactions, with a dashboard, an AI assistant and risk analytics."
  - w: Why
    lines:
      - Illicit payments hide in a 200,000-transaction graph; investigators need a ranked, explained shortlist instead of raw flows.
  - w: Who
    lines:
      - "Users: anti-money-laundering analysts and investigators."
      - "Data: the public Elliptic dataset, 203,769 transactions; 4,545 labelled illicit and 42,019 licit (Weber et al. 2019)."
  - w: Where
    lines:
      - "[Results page](https://sabrinapribadi.github.io/graph-fraud-detector/), [technical walkthrough](https://sabrinapribadi.github.io/graph-fraud-detector/build.html) and [transaction demo](https://sabrinapribadi.github.io/graph-fraud-detector/demo.html) on GitHub Pages; [dashboard](https://graph-fraud-detector.streamlit.app) on Streamlit Community Cloud; the API runs locally."
  - w: When it fails
    lines:
      - "Checked against the published benchmark first (illicit F1 within ±0.05 of 0.788): passed. A label inversion was found and fixed on the way."
      - "Every model collapses after a dark-market shutdown at time step 43 (F1 0.904 before, 0.031 after). No live A/B test: historical data."
  - w: How
    lines:
      - Random forest on 166 features with the dataset authors' time split; GraphSAGE and GAT on the graph; a bandit picks the alert threshold.
      - "Result: illicit F1 0.815 on later time steps (published 0.788); F1 is the balance of catching fraud and avoiding false alarms (1 is perfect)."
skills:
  - group: Graph machine learning
    what: GraphSAGE and GAT on the transaction graph
    proof: [["gnn_model.py", "src/models/gnn_model.py"], ["advanced_gnn.py", "src/models/advanced_gnn.py"]]
  - group: Machine learning and evaluation
    what: random forest, time-based split, per-step F1, replication of the published benchmark
    proof: [["ADR-004", "docs/adr/ADR-004-label-fix-and-evaluation.md"], ["evaluate_models.py", "scripts/evaluate_models.py"]]
  - group: Reinforcement learning
    what: LinUCB contextual bandit for the alert threshold
    proof: [["ADR-001", "docs/adr/ADR-001-rl-threshold-bandit.md"], ["bandit.py", "src/rl/bandit.py"]]
  - group: Quantitative risk
    what: Monte Carlo loss, value at risk, stress tests, Basel III capital
    proof: [["risk_analysis.py", "src/analytics/risk_analysis.py"], ["regulatory_capital.py", "src/analytics/regulatory_capital.py"]]
  - group: GenAI and agents
    what: LangChain agent with 9 tools, retrieval over a fraud knowledge base
    proof: [["fraud_agent.py", "src/agent/fraud_agent.py"], ["rag_agent.py", "src/agent/rag_agent.py"]]
  - group: Data engineering and services
    what: FastAPI service, medallion layers (document store and Postgres)
    proof: [["ADR-002", "docs/adr/ADR-002-mongodb-alert-layer.md"], ["ADR-003", "docs/adr/ADR-003-postgresql-gold-layer.md"]]
  - group: CI/CD
    what: GitHub Actions lint and tests on every push; static demo on Pages
    proof: [["ci.yml", ".github/workflows/ci.yml"]]
