name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt pytest ruff pyyaml
      # errors only (syntax, undefined names): the legacy code predates the portfolio lint rules
      - run: ruff check --select E9,F63,F7,F82 src scripts tests
      - name: Brief in sync with docs/brief.yaml (R22)
        run: python scripts/brief.py --check
      - run: python -m pytest -q tests
